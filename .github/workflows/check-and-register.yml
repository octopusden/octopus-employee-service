name: Check for artifact and register release

on:
  workflow_run:
    workflows: ["Gradle Release"]
    types:
      - completed

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-check-and-register-release.yml@v2.7.0
    if:  "${{ github.event.workflow_run.conclusion == 'success' }}"
    with:
      # Polls Maven Central for a released artifact of this repository before registering the
      # release. The employee-service module no longer publishes to Central (docker image only),
      # so the poll targets the client library, which is released at the same version.
      artifact-pattern: "octopus/employee/client/_VER_/client-_VER_.jar"
    secrets: inherit
